<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>タチコマ 音声テスト v0.2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>タチコマ <span class="ver">音声テスト v0.2</span></h1>
    <p class="note">この画面は試作品です。話した内容はどこにも保存・送信されません（音声認識はブラウザ／OSの機能を使います）。</p>
  </header>

  <section class="stage" aria-live="polite">
    <div id="bot" class="bot idle" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="120" height="120">
        <rect class="b-ant" x="57" y="6" width="6" height="16" rx="3"/>
        <circle class="b-tip" cx="60" cy="8" r="6"/>
        <rect class="b-head" x="14" y="22" width="92" height="74" rx="30"/>
        <rect class="b-face" x="26" y="36" width="68" height="44" rx="20"/>
        <circle class="b-eye l" cx="46" cy="58" r="8"/>
        <circle class="b-eye r" cx="74" cy="58" r="8"/>
        <rect class="b-mouth" x="52" y="70" width="16" height="4" rx="2"/>
        <rect class="b-foot" x="34" y="98" width="52" height="12" rx="6"/>
      </svg>
    </div>
    <p id="state" class="state">待機中</p>
  </section>

  <section class="talk">
    <button id="micBtn" class="mic" type="button">🎤 押して話す</button>
    <form id="textForm" class="textrow" autocomplete="off">
      <input id="textIn" type="text" placeholder="文字で話しかける" enterkeyhint="send">
      <button type="submit">送る</button>
    </form>
    <p id="interim" class="interim"></p>
    <p id="err" class="err" role="alert"></p>
  </section>

  <section class="log">
    <h2>会話 <button id="clearLog" type="button" class="link">消す</button></h2>
    <ol id="history" class="history"><li class="empty">まだ何も話していません。</li></ol>
  </section>

  <details class="panel" open>
    <summary>声の設定</summary>
    <label class="row">声
      <select id="voiceSel"><option>読み込み中…</option></select>
    </label>
    <label class="row">高さ <output id="pitchOut">1.6</output>
      <input id="pitch" type="range" min="0.5" max="2" step="0.1" value="1.6">
    </label>
    <label class="row">速さ <output id="rateOut">1.15</output>
      <input id="rate" type="range" min="0.6" max="1.6" step="0.05" value="1.15">
    </label>
    <button id="testSpeak" type="button" class="btn2">🔊 試しに喋らせる</button>
    <p class="small">iPhoneは、最初に一度ボタンを押さないと声が出ません。音が出ないときは消音スイッチと音量も確認してください。</p>
  </details>

  <details class="panel" open>
    <summary>診断（このブラウザで使えるか）</summary>
    <ul id="diag" class="diag"></ul>
    <button id="copyDiag" type="button" class="btn2">結果をコピー</button>
  </details>

  <footer class="foot">v0.2 ・ Life Game とは独立した試作 ・ 外部に送るデータなし</footer>
</main>
<script src="diag.js"></script>
<script src="app.js"></script>
</body>
</html>
